<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda & Tugas Kelas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Reminder Tugas Kelas XI IPA 1</h1>

    <p class="subtitle">
        Oleh PJ Disiplin
    </p>

    <div id="admin-status" class="admin-badge">
        🔓 MODE ADMIN AKTIF
    </div>

    <div id="admin-form" class="form-container">

        <form id="todo-form">

            <div class="form-grid">

                <div class="form-group">
                    <label for="mapel">Mata Pelajaran</label>
                
                    <select id="mapel" required>
                        <option value="" disabled selected>
                            Pilih Mata Pelajaran
                        </option>
                
                        <option value="B. Arab">B. Arab</option>
                        <option value="B. Indo">B. Indo</option>
                        <option value="B. Inggris">B. Inggris</option>
                        <option value="Biologi">Biologi</option>
                        <option value="Fisika">Fisika</option>
                        <option value="Kimia">Kimia</option>
                        <option value="Matlan">Matlan</option>
                        <option value="Matwa">Matwa</option>
                        <option value="PAI">PAI</option>
                        <option value="PPKn">PPKn</option>
                        <option value="Sejarah">Sejarah</option>
                        <option value="TIK">TIK</option>
                
                        <option value="Custom">Custom</option>
                    </select>
                
                    <input
                        type="text"
                        id="mapel-custom"
                        placeholder="Masukkan nama mata pelajaran"
                        style="display: none; margin-top: 8px;"
                    >
                </div>

                <div class="form-group">
                    <label for="tugas">Nama Tugas / Agenda</label>

                    <input
                        type="text"
                        id="tugas"
                        placeholder="Contoh: PR Halaman 45"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="deadline">Deadline</label>

                    <input
                        type="date"
                        id="deadline"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="keterangan">Keterangan</label>

                    <input
                        type="text"
                        id="keterangan"
                        placeholder="Contoh: Penting / Kelompok"
                    >
                </div>

            </div>

            <button type="submit" class="btn-submit">
                ➕ Tambah Tugas Baru
            </button>

        </form>

    </div>

    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th id="secret-title" style="width: 5%; cursor: pointer;">No</th>
                    <th style="width: 20%;">Mapel</th>
                    <th style="width: 35%;">Nama Tugas / Agenda</th>
                    <th style="width: 20%;">Deadline</th>
                    <th style="width: 15%;">Keterangan</th>
                    <th class="col-aksi" style="width: 5%;">Aksi</th>
                </tr>

            </thead>

            <tbody id="table-body">
            </tbody>

        </table>

    </div>

</div>

<!-- =========================
     HISTORY ADMIN
========================= -->

<div id="history-section" class="container" style="display: none;">

    <h2>History Aktivitas</h2>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>No</th>
                    <th>Aktivitas</th>
                    <th>Mapel</th>
                    <th>Nama Tugas</th>
                    <th>Waktu</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="history-body">
            </tbody>

        </table>

    </div>

</div>
    
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- JavaScript website -->
<script src="script.js"></script>

</body>
</html>
