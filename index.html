<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda & Tugas Kelas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2980b9;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 Agenda & Tugas Kelas</h1>
    <p class="subtitle">Pembaruan otomatis via Google Sheets</p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 5%;">No</th>
                    <th style="width: 20%;">Mapel</th>
                    <th style="width: 35%;">Nama Tugas / Agenda</th>
                    <th style="width: 20%;">Deadline</th>
                    <th style="width: 20%;">Keterangan</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="5" class="loading">Memuat data tugas terbaru...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ID Google Sheets milik Anda
    const SHEET_ID = '1hJs_TSgrZOVpAnPpVhH6k2XK_RemA2hwgMuf1qkFoXM';
    
    // URL API Google Sheets yang sudah diperbaiki lokasinya
    const url = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:json`;

    fetch(url)
        .then(res => res.text())
        .then(txt => {
            // Bersihkan bungkus teks bawaan Google API agar menjadi JSON murni
            const jsonString = txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1);
            const json = JSON.parse(jsonString);
            const rows = json.table.rows;
            
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = ''; // Bersihkan tulisan loading

            rows.forEach(row => {
                const cells = row.c;
                
                // Mengambil nilai teks dari setiap sel dengan validasi agar tidak error jika kosong
                const no = cells[0] && cells[0].v !== null ? cells[0].v : '';
                const mapel = cells[1] && cells[1].v !== null ? cells[1].v : '';
                const tugas = cells[2] && cells[2].v !== null ? cells[2].v : '';
                
                // Khusus tanggal menggunakan format ter-render (.f) agar tidak berantakan
                const deadline = cells[3] ? (cells[3].f ? cells[3].f : (cells[3].v !== null ? cells[3].v : '')) : '';
                const keterangan = cells[4] && cells[4].v !== null ? cells[4].v : '';

                // Lewati baris pertama jika itu adalah Judul Kolom (No, Mapel, dst)
                if (no.toString().toLowerCase() === 'no') return;

                if (no !== '') {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${no}</td>
                        <td><strong>${mapel}</strong></td>
                        <td>${tugas}</td>
                        <td>${deadline}</td>
                        <td>${keterangan}</td>
                    `;
                    tableBody.appendChild(tr);
                }
            });

            if (tableBody.innerHTML === '') {
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Tidak ada data tugas saat ini.</td></tr>';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('table-body').innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal memuat data. Silakan periksa kembali koneksi atau kode Anda.</td></tr>';
        });
</script>

</body>
</html>
