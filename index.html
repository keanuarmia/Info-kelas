<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda & Tugas Kelas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2980b9;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-urgent { background-color: #e74c3c; color: white; }
        .badge-normal { background-color: #f39c12; color: white; }
        .badge-ub { background-color: #9b59b6; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 Agenda & Tugas Kelas</h1>
    <p class="subtitle">Pembaruan harian oleh PJ Disiplin</p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 5%;">No</th>
                    <th style="width: 20%;">Mapel</th>
                    <th style="width: 35%;">Nama Tugas / Agenda</th>
                    <th style="width: 20%;">Deadline</th>
                    <th style="width: 20%;">Keterangan</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td><strong>Contoh Mapel</strong></td>
                    <td>Ini adalah contoh isi tugas kelas Anda.</td>
                    <td>Besok, 07:00 WIB</td>
                    <td><span class="badge badge-urgent">Penting!</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
