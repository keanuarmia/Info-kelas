<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda & Tugas Kelas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1 id="secret-title">Reminder Tugas Kelas</h1>

    <p class="subtitle">
        Oleh PJ Disiplin
    </p>

    <div id="admin-status" class="admin-badge">
        🔓 MODE ADMIN AKTIF
    </div>

    <div id="admin-form" class="form-container">

        <form id="todo-form">

            <div class="form-grid">

                <div class="form-group">
                    <label for="mapel">Mata Pelajaran</label>

                    <input
                        type="text"
                        id="mapel"
                        placeholder="Contoh: Matematika"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="tugas">Nama Tugas / Agenda</label>

                    <input
                        type="text"
                        id="tugas"
                        placeholder="Contoh: PR Halaman 45"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="deadline">Deadline</label>

                    <input
                        type="text"
                        id="deadline"
                        placeholder="Contoh: Besok, 07:00 WIB"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="keterangan">Keterangan</label>

                    <input
                        type="text"
                        id="keterangan"
                        placeholder="Contoh: Penting / Kelompok"
                    >
                </div>

            </div>

            <button type="submit" class="btn-submit">
                ➕ Tambah Tugas Baru
            </button>

        </form>

    </div>

    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th style="width: 5%;">No</th>
                    <th style="width: 20%;">Mapel</th>
                    <th style="width: 35%;">Nama Tugas / Agenda</th>
                    <th style="width: 20%;">Deadline</th>
                    <th style="width: 15%;">Keterangan</th>
                    <th class="col-aksi" style="width: 5%;">Aksi</th>
                </tr>

            </thead>

            <tbody id="table-body">
            </tbody>

        </table>

    </div>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- JavaScript website -->
<script src="script.js"></script>

</body>
</html>
