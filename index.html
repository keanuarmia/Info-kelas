<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda & Tugas Kelas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2980b9;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 Agenda & Tugas Kelas</h1>
    <p class="subtitle">Pembaruan otomatis via Google Sheets</p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 5%;">No</th>
                    <th style="width: 20%;">Mapel</th>
                    <th style="width: 35%;">Nama Tugas / Agenda</th>
                    <th style="width: 20%;">Deadline</th>
                    <th style="width: 20%;">Keterangan</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="5" class="loading">Memuat data tugas terbaru...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ID Google Sheets milik Anda sudah langsung dipasang di bawah ini:
    const SHEET_ID = '1an8GA3620cD38Dvb1H6YRAYS1hs5hq04mThLdfWuKO8';
    const SHEET_TITLE = 'Sheet1'; 
    
    const url = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_TITLE}`;

    fetch(url)
        .then(res => res.text())
        .then(data => {
            const rows = data.split('\n').slice(1); 
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = ''; 

            rows.forEach(row => {
                const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (columns.length >= 5) {
                    const no = columns[0].replace(/^"|"$/g, '').trim();
                    const mapel = columns[1].replace(/^"|"$/g, '').trim();
                    const tugas = columns[2].replace(/^"|"$/g, '').trim();
                    const deadline = columns[3].replace(/^"|"$/g, '').trim();
                    const keterangan = columns[4].replace(/^"|"$/g, '').trim();

                    if(no !== "") { 
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${no}</td>
                            <td><strong>${mapel}</strong></td>
                            <td>${tugas}</td>
                            <td>${deadline}</td>
                            <td>${keterangan}</td>
                        `;
                        tableBody.appendChild(tr);
                    }
                }
            });
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('table-body').innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal memuat data. Periksa pengaturan share Google Sheets Anda.</td></tr>';
        });
</script>

</body>
</html>
