<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda & Tugas Kelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1 id="secret-title">📅 Agenda & Tugas Kelas</h1>

    <p class="subtitle">
        Pembaruan harian oleh PJ Disiplin
    </p>

    <div id="admin-status" class="admin-badge">
        🔓 MODE ADMIN AKTIF
    </div>

    <div id="admin-form" class="form-container">
        <form id="todo-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="mapel">Mata Pelajaran</label>
                    <input
                        type="text"
                        id="mapel"
                        placeholder="Contoh: Matematika"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="tugas">Nama Tugas / Agenda</label>
                    <input
                        type="text"
                        id="tugas"
                        placeholder="Contoh: PR Halaman 45"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="deadline">Deadline</label>
                    <input
                        type="text"
                        id="deadline"
                        placeholder="Contoh: Besok, 07:00 WIB"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="keterangan">Keterangan</label>
                    <input
                        type="text"
                        id="keterangan"
                        placeholder="Contoh: Penting / Kelompok"
                    >
                </div>
            </div>

            <button type="submit" class="btn-submit">
                ➕ Tambah Tugas Baru
            </button>
        </form>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 5%;">No</th>
                    <th style="width: 20%;">Mapel</th>
                    <th style="width: 35%;">Nama Tugas / Agenda</th>
                    <th style="width: 20%;">Deadline</th>
                    <th style="width: 15%;">Keterangan</th>
                    <th class="col-aksi" style="width: 5%;">Aksi</th>
                </tr>
            </thead>

            <tbody id="table-body">
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
    'https://ofikhymoplfgahogmeml.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_j0DKnHBNpb6HCHW7aal3oA_KaLCTTwZ';

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const form =
    document.getElementById('todo-form');

const tableBody =
    document.getElementById('table-body');

const secretTitle =
    document.getElementById('secret-title');

let isAdmin = false;

let clickCount = 0;
let firstClickTime = 0;

secretTitle.addEventListener('click', () => {
    const currentTime =
        new Date().getTime();

    if (clickCount === 0) {
        firstClickTime = currentTime;
    }

    if (currentTime - firstClickTime > 3000) {
        clickCount = 1;
        firstClickTime = currentTime;
    } else {
        clickCount++;
    }

    if (clickCount === 5) {
        clickCount = 0;

        const password =
            prompt("Masukkan Password Admin:");

        if (password === "404") {
            aktifkanModeAdmin();
        } else {
            alert("Password salah!");
        }
    }
});

function aktifkanModeAdmin() {
    isAdmin = true;

    document.getElementById('admin-form')
        .style.display = 'block';

    document.getElementById('admin-status')
        .style.display = 'block';

    document.querySelectorAll('.col-aksi')
        .forEach(el => {
            el.style.display = 'table-cell';
        });

    tampilkanTugas();
}

async function dapatkanTugas() {
    const { data, error } =
        await supabaseClient
            .from('tugas')
            .select('*')
            .order('created_at', {
                ascending: false
            });

    if (error) {
        console.error(
            'Gagal mengambil tugas:',
            error
        );

        alert(
            'Gagal memuat data tugas.'
        );

        return [];
    }

    return data || [];
}

async function tampilkanTugas() {
    const daftarTugas =
        await dapatkanTugas();

    tableBody.innerHTML = '';

    if (daftarTugas.length === 0) {
        const totalKolom =
            isAdmin ? 6 : 5;

        tableBody.innerHTML = `
            <tr>
                <td
                    colspan="${totalKolom}"
                    class="no-data"
                >
                    Belum ada agenda atau tugas kelas saat ini.
                </td>
            </tr>
        `;

        return;
    }

    daftarTugas.forEach(
        (item, index) => {
            const tr =
                document.createElement('tr');

            let isiBaris = `
                <td>
                    ${index + 1}
                </td>

                <td>
                    <strong>
                        ${item.mapel}
                    </strong>
                </td>

                <td>
                    ${item.tugas}
                </td>

                <td>
                    ${item.deadline}
                </td>

                <td>
                    ${item.keterangan || '-'}
                </td>
            `;

            if (isAdmin) {
                isiBaris += `
                    <td class="col-aksi">
                        <button
                            class="btn-edit"
                            onclick="editTugas(${item.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="btn-delete"
                            onclick="hapusTugas(${item.id})"
                        >
                            Hapus
                        </button>
                    </td>
                `;
            }

            tr.innerHTML =
                isiBaris;

            tableBody.appendChild(tr);
        }
    );

    document.querySelectorAll('.col-aksi')
        .forEach(el => {
            el.style.display =
                isAdmin
                    ? 'table-cell'
                    : 'none';
        });
}

form.addEventListener(
    'submit',
    async function(e) {
        e.preventDefault();

        const mapel =
            document.getElementById('mapel').value;

        const tugas =
            document.getElementById('tugas').value;

        const deadline =
            document.getElementById('deadline').value;

        const keterangan =
            document.getElementById('keterangan').value;

        const { error } =
            await supabaseClient
                .from('tugas')
                .insert([
                    {
                        mapel: mapel,
                        tugas: tugas,
                        deadline: deadline,
                        keterangan: keterangan
                    }
                ]);

        if (error) {
            console.error(
                'Gagal menambahkan tugas:',
                error
            );

            alert(
                'Gagal menambahkan tugas.'
            );

            return;
        }

        await tampilkanTugas();

        form.reset();
    }
);

window.hapusTugas =
    async function(id) {
        if (
            confirm(
                "Apakah Anda yakin ingin menghapus tugas ini?"
            )
        ) {
            const { error } =
                await supabaseClient
                    .from('tugas')
                    .delete()
                    .eq('id', id);

            if (error) {
                console.error(
                    'Gagal menghapus tugas:',
                    error
                );

                alert(
                    'Gagal menghapus tugas.'
                );

                return;
            }

            await tampilkanTugas();
        }
    };

window.editTugas =
    async function(id) {
        const daftarTugas =
            await dapatkanTugas();

        const tugas =
            daftarTugas.find(
                item => item.id === id
            );

        if (!tugas) {
            alert('Tugas tidak ditemukan.');
            return;
        }

        const mapel =
            prompt(
                'Mata Pelajaran:',
                tugas.mapel
            );

        if (mapel === null) return;

        const namaTugas =
            prompt(
                'Nama Tugas / Agenda:',
                tugas.tugas
            );

        if (namaTugas === null) return;

        const deadline =
            prompt(
                'Deadline:',
                tugas.deadline
            );

        if (deadline === null) return;

        const keterangan =
            prompt(
                'Keterangan:',
                tugas.keterangan || ''
            );

        if (keterangan === null) return;

        const { error } =
            await supabaseClient
                .from('tugas')
                .update({
                    mapel: mapel,
                    tugas: namaTugas,
                    deadline: deadline,
                    keterangan: keterangan
                })
                .eq('id', id);

        if (error) {
            console.error(
                'Gagal mengedit tugas:',
                error
            );

            alert(
                'Gagal mengedit tugas.'
            );

            return;
        }

        await tampilkanTugas();
    };

tampilkanTugas();
</script>

</body>
</html>
